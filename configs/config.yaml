server:
  addr: ":8080"

mysql:
  host: "127.0.0.1"
  port: 3306
  user: "eino_risk_qa"
  password: "EinoRiskQa#2026"
  database: "eino_risk_qa"

llm:
  provider: "deepseek" # mock | openai | ark | deepseek
  vision_provider: "ark" # 图片审核使用火山引擎 Ark，文本审核仍使用主 provider
  request_timeout_seconds: 300 # 单个风险要素的模型判断总超时，避免整个批次无限等待
  openai:
    api_key: ""
    base_url: ""
    model: "gpt-4o-mini"
  ark:
    api_key: "" # 留空，仅通过环境变量 ARK_API_KEY 注入，不写入配置文件
    base_url: "https://ark.cn-beijing.volces.com/api/v3"
    model: "doubao-seed-2-1-turbo-260628"
  deepseek:
    api_key: "" # 留空，通过环境变量 EINO_RISK_QA_LLM_DEEPSEEK_API_KEY 注入，不写入配置文件
    base_url: "" # 留空则使用默认值 https://api.deepseek.com/
    model: "deepseek-v4-flash" # deepseek-chat | deepseek-reasoner

storage:
  local_dir: "./data/uploads"
  max_file_bytes: 10485760
  max_files_per_question: 5
  allowed_mime_types:
    - "image/jpeg"
    - "image/png"
    - "image/webp"

auth:
  api_key: "" # 留空表示不启用鉴权，本地调试建议留空；生产环境务必设置

log:
  level: "info" # debug | info | warn | error
