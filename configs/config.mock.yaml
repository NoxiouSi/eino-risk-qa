server:
  addr: ":8080"

mysql:
  host: "127.0.0.1"
  port: 3306
  user: "eino_risk_qa"
  password: "EinoRiskQa#2026"
  database: "eino_risk_qa"

llm:
  provider: "mock" # mock 模式，无需 API Key
  vision_provider: ""
  request_timeout_seconds: 300
  openai:
    api_key: ""
    base_url: ""
    model: "gpt-4o-mini"
  ark:
    api_key: ""
    base_url: "https://ark.cn-beijing.volces.com/api/v3"
    model: "doubao-seed-2-1-turbo-260628"
  deepseek:
    api_key: ""
    base_url: ""
    model: "deepseek-v4-flash"
  attack_detector:
    enabled: true                     # mock 模式下 LLM 调用被 IsMock() 绕过
    confidence_threshold: 0.85
    timeout_seconds: 10

storage:
  local_dir: "./data/uploads"
  max_file_bytes: 10485760
  max_stored_image_bytes: 1048576
  max_files_per_question: 5
  allowed_mime_types:
    - "image/jpeg"
    - "image/png"
    - "image/webp"

auth:
  api_key: "" # 本地调试不启用鉴权

log:
  level: "debug" # mock 模式下开启 debug 日志便于调试
